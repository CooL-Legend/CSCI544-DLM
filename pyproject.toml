[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csci544-dlm"
version = "0.1.0"
description = "Inspectable diffusion language model inference on Sudoku and GSM8K"
readme = "README.md"
requires-python = ">=3.10"
# Install the selected model's requirements profile before this editable package.

[tool.setuptools.packages.find]
where = ["src"]
include = ["dlm_project*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
