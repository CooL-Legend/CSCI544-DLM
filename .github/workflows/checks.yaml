name: Python and notebook checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [llada, illada]
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.2,<3.0' --index-url https://download.pytorch.org/whl/cpu
          if [ "${{ matrix.profile }}" = "illada" ]; then
            python -m pip install -r requirements-illada-colab.txt -r requirements-dev.txt
          else
            python -m pip install -r requirements-colab.txt -r requirements-dev.txt
          fi
      - name: Check data handling, saved results, and notebook structure
        run: python -m pytest -q
