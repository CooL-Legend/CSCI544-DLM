# Same frozen LLaDA checkpoint for every condition. Current one-step MCTS variant.
model:
  family: llada
  model_path: GSAI-ML/LLaDA-8B-Instruct
  device: cuda
  dtype: bfloat16
  local_files_only: false
data:
  num_samples: null  # smoke: 3; milestone: 30; override with --num-samples
  cache_dir: null
  source: bgpo_4x4  # Only the dataset; the model remains original LLaDA.
generation:
  gen_length: 256
  steps: 256
  block_length: 256
  temperature: 0.0
  remasking: low_confidence
decoding:
  method: mcts_entropy
  seed: 1
  mcts:
    init_tokens: 20
    num_candidates: 3  # Inactive in budget-stop mode; retained for compatibility.
    top_k_tokens: 3
    top_k_actions: 5
    margin_gamma: 10.0
    exploration_c: 0.01
    epsilon: 1.0e-8
    stop_mode: budget
sweep:
  profile: smoke
  sample_seed: 1
  budgets: [128, 256, 512]
  warmup: true
experiment_root: results
experiment_timezone: America/Los_Angeles
