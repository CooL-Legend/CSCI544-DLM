# One-puzzle, one-token-at-a-time MEDAL entropy walkthrough.
data:
  num_samples: 1
  cache_dir: null
model:
  family: llada
  model_path: GSAI-ML/LLaDA-8B-Instruct
  device: cuda
  dtype: bfloat16
  local_files_only: false
generation:
  steps: 256
  gen_length: 256
  block_length: 256
  temperature: 0.0
  remasking: low_confidence
decoding:
  method: mcts_entropy  # baseline | confidence | mcts_entropy
  seed: 1
  mcts:
    init_tokens: 2      # Lc: number of output tokens committed in a candidate
    num_candidates: 3  # C: stop after collecting at least this many distinct states
    top_k_tokens: 2    # K1: tokens retained per position
    top_k_actions: 2   # K2: actions retained globally
    max_model_calls: 32  # Root + children; completion is counted separately
    margin_gamma: 10.0
    exploration_c: 0.01
    epsilon: 1.0e-8
experiment_root: results
experiment_timezone: America/Los_Angeles
