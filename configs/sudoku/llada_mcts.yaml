# MEDAL paper reconstruction; interpretations are saved in every run.
data:
  num_samples: 1
  cache_dir: null
model:
  family: llada
  model_path: GSAI-ML/LLaDA-8B-Instruct
  device: cuda
  dtype: bfloat16
  local_files_only: false
prompt:
  # Keep the task's strict 81-digit answer instruction; do not add reasoning demos.
  medal_decomposition: false
generation:
  steps: 256
  gen_length: 256
  block_length: 256
  temperature: 0.0
  remasking: low_confidence
decoding:
  method: mcts_entropy
  seed: 1
  mcts:
    init_tokens: 10
    num_candidates: 1
    top_k_tokens: 3
    top_k_actions: 2
    max_model_calls: null
    margin_gamma: 10.0
    exploration_c: 0.01
    epsilon: 1.0e-08
    stop_mode: candidates
    completion_policy: dlm
experiment_root: results
experiment_timezone: America/Los_Angeles
